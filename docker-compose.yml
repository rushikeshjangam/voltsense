# VoltSense — Phase 0 local dev stack
# Kafka (KRaft, no ZooKeeper) + Schema Registry + Qdrant.
#
# Dual-listener design (works for BOTH worlds):
#   INTERNAL  -> kafka:29092      container-to-container traffic (Schema Registry,
#                                  Flink, producer running inside compose)
#   EXTERNAL  -> localhost:9092    host-side access (your notebook / a producer run
#                                  from the WSL/Ubuntu shell)
#   CONTROLLER-> kafka:9093        KRaft controller quorum (internal only)
#
# Bring up:  make up     Prove it:  make health
services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: voltsense-kafka
    ports:
      - "9092:9092"        # EXTERNAL listener, advertised as localhost:9092
    environment:
      # --- KRaft (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # A fixed cluster id keeps the volume reusable across restarts.
      CLUSTER_ID: "VoltSense-Phase0-KRaft01"
      # --- dual listeners ---
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # --- single-node sane defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Hits the EXTERNAL listener so a green check also implies host-style reachability.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: voltsense-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # Uses the INTERNAL listener — registry lives inside the compose network.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: voltsense-qdrant
    ports:
      - "6333:6333"        # REST/HTTP
      - "6334:6334"        # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant's image ships no curl/wget; use a bash TCP probe on the REST port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kafka-data:
  qdrant-data:
